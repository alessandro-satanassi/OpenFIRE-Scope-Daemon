name: CMake - macOS DMGs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [macos-latest]
        qt_version: [6.9.2]
        build_type: [Debug, Release]
        include:
          - os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            sys_arch: universal
            pretty: "macOS Universal DMG"

    steps:
    - uses: actions/checkout@v6

    - name: Get short SHA
      id: get-short-sha
      run: echo "id=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '${{ matrix.qt_version }}'
        host: '${{ matrix.qt_host }}'
        arch: '${{ matrix.qt_arch }}'
        modules: 'qtserialport'
        archives: 'qtbase qttranslations qttools qtsvg'
        cache: true

    - name: Configure CMake
      run: >
        cmake -B "${{ github.workspace }}/build"
        -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}"
        -DOFD_GITHASH="${{steps.get-short-sha.outputs.id}}"
        -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
        -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
        -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }} --parallel

    - name: Deploy macOS App & DMG
      run: |
        cmake --install "${{ github.workspace }}/build" --prefix "${{ github.workspace }}/build/out"
        APP_BUNDLE="${{ github.workspace }}/build/out/OpenFIRE-Scope-Daemon.app"
        if [ ! -d "$APP_BUNDLE" ]; then
          echo "Application bundle not found!"
          exit 1
        fi
        echo "==== Verifying Universal Binary ===="
        file "$APP_BUNDLE/Contents/MacOS/OpenFIRE-Scope-Daemon"
        lipo -info "$APP_BUNDLE/Contents/MacOS/OpenFIRE-Scope-Daemon"
        echo "===================================="
        macdeployqt "$APP_BUNDLE" -dmg
        DMG="${{ github.workspace }}/build/out/OpenFIRE-Scope-Daemon.dmg"
        if [ ! -f "$DMG" ]; then
          echo "DMG was not created!"
          exit 1
        fi
        mv "$DMG" "${{ github.workspace }}/build/out/OpenFIRE-Scope-Daemon-${{ matrix.sys_arch }}.dmg"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: OpenFIRE-Scope-Daemon-${{ matrix.pretty }}-Qt${{ matrix.qt_version }}-${{ matrix.build_type }}
        path: build/out/OpenFIRE-Scope-Daemon-${{ matrix.sys_arch }}.dmg
