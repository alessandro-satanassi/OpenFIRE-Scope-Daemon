name: CMake - Linux AppImages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_version: 6.8.3
            sys_arch: x86_64
            pretty: "Linux x86 AppImage"
          - os: ubuntu-22.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_version: 6.7.3
            sys_arch: aarch64
            pretty: "Linux ARM AppImage"

    steps:
    - uses: actions/checkout@v6

    - name: Get short SHA
      id: get-short-sha
      run: echo "id=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '${{ matrix.qt_version }}'
        host: '${{ matrix.qt_host }}'
        arch: '${{ matrix.qt_arch }}'
        modules: 'qtserialport qtwaylandcompositor'
        archives: 'qtbase qtwayland qttranslations qttools qtsvg icu'
        cache: true

    - name: Configure CMake
      run: >
        cmake -B "${{ github.workspace }}/build"
        -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}"
        -DOFD_GITHASH="${{steps.get-short-sha.outputs.id}}"
        -DCMAKE_INSTALL_PREFIX=/usr
        -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }} --parallel

    - name: Install linuxdeploy
      uses: pcolby/install-linuxdeploy@v1
      with:
        plugins: qt appimage

    - name: Setup AppImage
      env:
        EXTRA_PLATFORM_PLUGINS: libqwayland-generic.so
        EXTRA_QT_MODULES: waylandcompositor
      run: |
        make install DESTDIR=AppDir
        install -Dm644 "${{ github.workspace }}/resources/openfire.svg" "AppDir/usr/share/icons/hicolor/scalable/apps/org.TeamOpenFIRE.ScopeDaemon.svg"
        "${{ runner.temp }}/linuxdeploy/linuxdeploy-${{ matrix.sys_arch }}.AppImage" --plugin=qt --output appimage --appdir AppDir --desktop-file "${{ github.workspace }}/org.TeamOpenFIRE.ScopeDaemon.desktop"
        mv "OpenFIRE_Scope_Daemon-${{matrix.sys_arch}}.AppImage" "${{ github.workspace }}"
      working-directory: ${{ github.workspace }}/build

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: OpenFIRE-Scope-Daemon-${{ matrix.pretty }}-Qt${{ matrix.qt_version }}-${{ matrix.build_type }}
        path: "OpenFIRE_Scope_Daemon-${{matrix.sys_arch}}.AppImage"
